name: pygod
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      # RTX 50-series (Blackwell, sm_120) requires a CUDA 12.8+ PyTorch wheel.
      # Keep PyG's compiled extensions on the matching wheel index.
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - --find-links https://data.pyg.org/whl/torch-2.7.0+cu128.html
      - torch==2.7.0
      - torchvision==0.22.0
      - torchaudio==2.7.0
      - torch-geometric==2.7.0
      - pyg-lib
      - pygod==1.1.0
      - numpy==1.26.4
      - pandas
      - networkx
      - scikit-learn
